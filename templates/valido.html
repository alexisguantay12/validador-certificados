<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Válido</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #f5f5f5;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #333;
        }

        .site-header {
            background: #efefef;
            border-bottom: 1px solid #d7d7d7;
            min-height: 166px;
        }

        .header-inner {
            max-width: 1720px;
            margin: 0 auto;
            padding: 10px 24px 8px;
            display: flex;
            align-items: flex-start;
        }

        .brand-wrap {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-left: 76px;
            margin-top: 2px;
        }

        .brand-seal {
            width: 74px;
            height: 122px;
            border: 2px solid #111;
            border-radius: 50% / 44%;
            position: relative;
            overflow: hidden;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.82) 0px,
                    rgba(0,0,0,0.82) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(0,0,0,0.14) 0px,
                    rgba(0,0,0,0.14) 1px,
                    transparent 1px,
                    transparent 5px
                ),
                #f3f3f3;
        }

        .brand-seal:before,
        .brand-seal:after {
            content: "";
            position: absolute;
            border-radius: 50% / 44%;
            left: 7px;
            right: 7px;
            top: 7px;
            bottom: 7px;
            border: 1px solid rgba(0,0,0,0.45);
        }

        .brand-seal:after {
            left: 14px;
            right: 14px;
            top: 14px;
            bottom: 14px;
            border-color: rgba(0,0,0,0.25);
        }

        .brand-text {
            margin-top: 10px;
        }

        .brand-title {
            margin: 0;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            color: #555;
            letter-spacing: 0;
        }

        .brand-title .blue {
            color: #2f89de;
        }

        .brand-subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #7b7b7b;
            letter-spacing: .1px;
        }

        .top-menu {
            background: linear-gradient(to bottom, #f7f7f7 0%, #ededed 100%);
            border-top: 1px solid #fafafa;
            border-bottom: 1px solid #d4d4d4;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
        }

        .top-menu .container-fluid {
            max-width: 1720px;
            padding-left: 0;
            padding-right: 0;
        }

        .menu-list {
            list-style: none;
            margin: 0;
            padding: 0 0 0 105px;
            display: flex;
            flex-wrap: nowrap;
        }

        .menu-list li {
            margin: 0;
            padding: 0;
        }

        .menu-list li a {
            display: block;
            padding: 16px 20px;
            font-size: 17px;
            color: #555;
            text-decoration: none;
            border-left: 1px solid #e4e4e4;
            border-right: 1px solid #e4e4e4;
            background: transparent;
        }

        .menu-list li a:hover {
            background: #f1f1f1;
        }

        .menu-list li.active a {
            background: #1096d9;
            color: #fff;
            font-weight: 600;
            border-color: #0d85c0;
        }

        .page-wrap {
            max-width: 1720px;
            margin: 0 auto;
            padding: 26px 20px 60px;
        }

        .content-inner {
            margin-left: 92px;
            margin-right: 92px;
        }

        .titulo {
            margin: 0;
            color: #1388cc;
            font-size: 31px;
            font-weight: 700;
            letter-spacing: .2px;
        }

        .title-line {
            height: 1px;
            background: #e6e6e6;
            margin-top: 8px;
            margin-bottom: 14px;
        }

        .resultado-box {
            background: #ececec;
            border-radius: 8px;
            min-height: 455px;
            padding: 78px 80px 88px;
        }

        .resultado-titulo {
            margin: 0;
            text-align: center;
            font-size: 76px;
            line-height: 1.05;
            font-weight: 700;
            color: #2f2f2f;
            letter-spacing: -.5px;
        }

        .resultado-alerta {
            max-width: 1420px;
            margin: 34px auto 28px;
            background: #dff0d8;
            border: 1px solid #cfe7bd;
            border-radius: 5px;
            padding: 20px 18px;
            text-align: center;
            color: #2f3d2f;
            font-size: 25px;
        }

        .acciones {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-accion {
            min-width: 120px;
            height: 58px;
            padding: 0 26px;
            border-radius: 9px;
            border: 1px solid #0d63d0;
            background: linear-gradient(to bottom, #0499db 0%, #0b43d9 100%);
            color: #fff;
            font-size: 22px;
            line-height: 56px;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
            text-decoration: none;
        }

        .btn-accion:hover,
        .btn-accion:focus {
            color: #fff;
            text-decoration: none;
            background: linear-gradient(to bottom, #038fd0 0%, #093fd0 100%);
        }

        .detalle-certificado {
            margin-top: 36px;
            text-align: center;
            color: #666;
            font-size: 18px;
        }

        @media (max-width: 1200px) {
            .brand-wrap {
                margin-left: 24px;
            }

            .menu-list {
                padding-left: 24px;
            }

            .content-inner {
                margin-left: 24px;
                margin-right: 24px;
            }

            .resultado-titulo {
                font-size: 60px;
            }
        }

        @media (max-width: 767px) {
            .site-header {
                min-height: auto;
            }

            .header-inner {
                padding: 14px 12px 10px;
            }

            .brand-wrap {
                margin-left: 0;
                gap: 12px;
            }

            .brand-seal {
                width: 52px;
                height: 88px;
            }

            .brand-title {
                font-size: 28px;
            }

            .brand-subtitle {
                font-size: 11px;
            }

            .menu-list {
                padding-left: 0;
                overflow-x: auto;
                white-space: nowrap;
            }

            .menu-list li {
                flex: 0 0 auto;
            }

            .menu-list li a {
                padding: 14px 16px;
                font-size: 15px;
            }

            .page-wrap {
                padding: 18px 12px 35px;
            }

            .content-inner {
                margin-left: 0;
                margin-right: 0;
            }

            .titulo {
                font-size: 24px;
            }

            .resultado-box {
                min-height: auto;
                padding: 30px 14px 34px;
            }

            .resultado-titulo {
                font-size: 42px;
            }

            .resultado-alerta {
                font-size: 18px;
                padding: 14px;
                margin-top: 22px;
            }

            .acciones {
                flex-direction: column;
                gap: 14px;
            }

            .btn-accion {
                width: 100%;
                min-width: 100%;
                font-size: 20px;
                line-height: 54px;
            }
        }

        @media print {
            .top-menu,
            .acciones {
                display: none !important;
            }

            .page-wrap {
                padding-top: 10px;
            }

            .resultado-box {
                background: #fff;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <div class="brand-wrap">
                <div class="brand-seal"></div>

                <div class="brand-text">
                    <h1 class="brand-title">SIU<span class="blue">GUARANÍ</span></h1>
                    <div class="brand-subtitle">MÓDULO DE GESTIÓN ACADÉMICA</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="top-menu">
        <div class="container-fluid">
            <ul class="menu-list"> 
                <li class="active"><a href="#">Validador de Certificados</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrap">
        <div class="content-inner">
            <h2 class="titulo">Validador de Certificados</h2>
            <div class="title-line"></div>

            <div class="resultado-box">
                <h1 class="resultado-titulo">Certificado Válido</h1>

                <div class="resultado-alerta">
                    El certificado es válido y está vigente
                </div>

                <div class="acciones">
                    <a href="/" class="btn-accion">Volver</a>
                    <button type="button" class="btn btn-accion" onclick="window.print()">◉ Imprimir</button>
                </div> 
            </div>
        </div>
    </div>

</body>
</html>
