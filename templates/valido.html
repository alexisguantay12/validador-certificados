{%load static%}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siu Guarani</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="icon" href="{% static 'img/siu.jpg' %}" type="image/x-icon">
<style>
    html, body {
        margin: 0;
        padding: 0;
    }

    body {
        background: #f5f5f5;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #333;
    }

    .brand-logo{
        height: 80px;
        width: auto;
        margin-right: 8px;
    }

    .site-header {
        background: #efefef;
        border-bottom: 1px solid #d7d7d7;
        min-height: 132px;
    }

    .header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 10px 18px 8px;
        display: flex;
        align-items: flex-start;
    }

    .brand-wrap {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-left: 56px;
        margin-top: 2px;
    }

    .brand-seal {
        width: 58px;
        height: 96px;
        border: 2px solid #111;
        border-radius: 50% / 44%;
        position: relative;
        overflow: hidden;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.82) 0px,
                rgba(0,0,0,0.82) 1px,
                transparent 1px,
                transparent 4px
            ),
            repeating-linear-gradient(
                90deg,
                rgba(0,0,0,0.14) 0px,
                rgba(0,0,0,0.14) 1px,
                transparent 1px,
                transparent 5px
            ),
            #f3f3f3;
    }

    .brand-seal:before,
    .brand-seal:after {
        content: "";
        position: absolute;
        border-radius: 50% / 44%;
        left: 6px;
        right: 6px;
        top: 6px;
        bottom: 6px;
        border: 1px solid rgba(0,0,0,0.45);
    }

    .brand-seal:after {
        left: 11px;
        right: 11px;
        top: 11px;
        bottom: 11px;
        border-color: rgba(0,0,0,0.25);
    }

    .brand-text {
        margin-top: 8px;
    }

    .brand-title {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        color: #555;
        letter-spacing: 0;
    }

    .brand-title .blue {
        color: #2f89de;
    }

    .brand-subtitle {
        margin-top: 6px;
        font-size: 10px;
        color: #7b7b7b;
        letter-spacing: .1px;
    }

    .top-menu {
        background: linear-gradient(to bottom, #f7f7f7 0%, #ededed 100%);
        border-top: 1px solid #fafafa;
        border-bottom: 1px solid #d4d4d4;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    .top-menu .container-fluid {
        max-width: 1280px;
        padding-left: 0;
        padding-right: 0;
    }

    .menu-list {
        list-style: none;
        margin: 0;
        padding: 0 0 0 84px;
        display: flex;
        flex-wrap: nowrap;
    }

    .menu-list li {
        margin: 0;
        padding: 0;
    }

    .menu-list li a {
        display: block;
        padding: 13px 16px;
        font-size: 14px;
        color: #555;
        text-decoration: none;
        border-left: 1px solid #e4e4e4;
        border-right: 1px solid #e4e4e4;
        background: transparent;
    }

    .menu-list li a:hover {
        background: #f1f1f1;
    }

    .menu-list li.active a {
        background: #1096d9;
        color: #fff;
        font-weight: 600;
        border-color: #0d85c0;
    }

    .page-wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px 18px 44px;
    }

    .content-inner {
        margin-left: 74px;
        margin-right: 74px;
    }

    .titulo {
        margin: 0;
        color: #1388cc;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: .1px;
    }

    .title-line {
        height: 1px;
        background: #e6e6e6;
        margin-top: 6px;
        margin-bottom: 12px;
    }

    .resultado-box {
        background: #ececec;
        border-radius: 8px;
        min-height: 360px;
        padding: 52px 56px 62px;
    }

    .resultado-titulo {
        margin: 0;
        text-align: center;
        font-size: 60px;
        line-height: 1.05;
        font-weight: 700;
        color: #2f2f2f;
        letter-spacing: -.4px;
    }

    .resultado-alerta {
        max-width: 100%;
        margin: 28px auto 22px;
        background: #dff0d8;
        border: 1px solid #cfe7bd;
        border-radius: 5px;
        padding: 16px 14px;
        text-align: center;
        color: #2f3d2f;
        font-size: 20px;
    }

    .acciones {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .btn-accion {
        min-width: 98px;
        height: 46px;
        padding: 0 20px;
        border-radius: 8px;
        border: 1px solid #0d63d0;
        background: linear-gradient(to bottom, #0499db 0%, #0b43d9 100%);
        color: #fff;
        font-size: 17px;
        line-height: 44px;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
        text-decoration: none;
    }

    .btn-accion:hover,
    .btn-accion:focus {
        color: #fff;
        text-decoration: none;
        background: linear-gradient(to bottom, #038fd0 0%, #093fd0 100%);
    }

    .detalle-certificado {
        margin-top: 28px;
        text-align: center;
        color: #666;
        font-size: 15px;
    }

    @media (max-width: 1200px) {
        .brand-wrap {
            margin-left: 24px;
        }

        .menu-list {
            padding-left: 24px;
        }

        .content-inner {
            margin-left: 24px;
            margin-right: 24px;
        }

        .resultado-titulo {
            font-size: 48px;
        }
    }

    @media (max-width: 767px) {
        .site-header {
            min-height: auto;
        }

        .header-inner {
            padding: 12px 10px 8px;
        }

        .brand-wrap {
            margin-left: 0;
            gap: 10px;
        }

        .brand-seal {
            width: 42px;
            height: 72px;
        }

        .brand-title {
            font-size: 22px;
        }

        .brand-subtitle {
            font-size: 9px;
        }

        .menu-list {
            padding-left: 0;
            overflow-x: auto;
            white-space: nowrap;
        }

        .menu-list li {
            flex: 0 0 auto;
        }

        .menu-list li a {
            padding: 11px 13px;
            font-size: 12px;
        }

        .page-wrap {
            padding: 16px 10px 28px;
        }

        .content-inner {
            margin-left: 0;
            margin-right: 0;
        }

        .titulo {
            font-size: 21px;
        }

        .resultado-box {
            min-height: auto;
            padding: 24px 12px 28px;
        }

        .resultado-titulo {
            font-size: 36px;
        }

        .resultado-alerta {
            font-size: 16px;
            padding: 12px;
            margin-top: 18px;
        }

        .acciones {
            flex-direction: column;
            gap: 12px;
        }

        .brand-logo{
            height: 56px;
        }

        .btn-accion {
            width: 100%;
            min-width: 100%;
            font-size: 16px;
            line-height: 42px;
            height: 44px;
        }
    }

    @media print {
        .top-menu,
        .acciones {
            display: none !important;
        }

        .page-wrap {
            padding-top: 10px;
        }

        .resultado-box {
            background: #fff;
            border: 1px solid #ddd;
        }
    }
</style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <div class="brand-wrap"> 
                
                <img src="{% static 'img/unsa.png' %}" class="brand-logo">

                <div class="brand-text">
                    <h1 class="brand-title">SIU<span class="blue">GUARANÍ</span></h1>
                    <div class="brand-subtitle">MÓDULO DE GESTIÓN ACADÉMICA</div>
                </div>
            </div>
        </div>
    </header>

    <nav class="top-menu">
        <div class="container-fluid">
            <ul class="menu-list"> 
                <li class="active"><a href="#">Validador de Certificados</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrap">
        <div class="content-inner">
            <h2 class="titulo">Validador de Certificados</h2>
            <div class="title-line"></div>

            <div class="resultado-box">
                <h1 class="resultado-titulo">Certificado Válido</h1>

                <div class="resultado-alerta">
                    El certificado es válido y está vigente
                </div>

                <div class="acciones">
                    <a href="/autogestion/validador_certificados/" class="btn-accion">Volver</a>
                    <a href="{% static pdf %}" target="_blank" class="btn-accion">
                        ◉ Imprimir
                    </a>
                </div> 
            </div>
        </div>
    </div>

</body>
</html>
